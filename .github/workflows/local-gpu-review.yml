name: Local RTX 2060 Review Render

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hindi-facts-local-review
  cancel-in-progress: false

jobs:
  render:
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify local Python and GPU tools
        run: |
          python --version
          $blenderExe = "C:\Program Files\Blender Foundation\Blender 5.3\blender.exe"
          if (-not (Test-Path $blenderExe)) {
            throw "Blender executable not found at: $blenderExe"
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            throw "FFmpeg is not in PATH. Install FFmpeg and add its bin folder to PATH."
          }
          & $blenderExe --version
          ffmpeg -version
          if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
            nvidia-smi
          } else {
            Write-Warning "nvidia-smi not found; NVIDIA driver status could not be checked."
          }

      - name: Confirm repository files
        run: |
          if (-not (Test-Path requirements.txt)) {
            throw "requirements.txt is missing from the repository."
          }
          if (-not (Test-Path render_3d.py)) {
            throw "render_3d.py is missing from the repository."
          }

      - name: Render a real sample 3D Hindi fact video locally
        run: |
          $blenderExe = "C:\Program Files\Blender Foundation\Blender 5.3\blender.exe"
          $outDir = Join-Path $env:GITHUB_WORKSPACE "output"
          $metadata = Join-Path $env:RUNNER_TEMP "sample_short_metadata.json"
          New-Item -ItemType Directory -Force -Path $outDir | Out-Null
          $sample = @{
            title = "समुद्र के नीचे की अनोखी दुनिया"
            screens = @(
              "समुद्र की गहराई में अंधेरा",
              "कुछ जीव खुद रोशनी बनाते हैं",
              "इसे बायोल्यूमिनेसेंस कहते हैं",
              "रोशनी से शिकार भी होता है",
              "प्रकृति का अपना टॉर्च सिस्टम"
            )
          } | ConvertTo-Json -Depth 5
          [System.IO.File]::WriteAllText($metadata, $sample, (New-Object System.Text.UTF8Encoding($false)))
          & $blenderExe --background --python render_3d.py -- $metadata $outDir
          if ($LASTEXITCODE -ne 0) {
            throw "The local 3D scene render failed with exit code $LASTEXITCODE"
          }
          $video = Join-Path $outDir "three_d_visuals.mp4"
          if (-not (Test-Path $video)) {
            throw "The 3D render did not create three_d_visuals.mp4"
          }
          ffprobe -v error -show_entries format=duration -of default=noprint_wrappers=1:nokey=1 $video
          Write-Host "SAMPLE_3D_VIDEO_READY=$video"

      - name: Save sample 3D video for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: local-rtx-sample-3d-video
          path: output/three_d_visuals.mp4
          if-no-files-found: ignore
          retention-days: 3
