name: Local RTX 2060 Review Render

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: hindi-facts-local-review
  cancel-in-progress: false

jobs:
  render:
    defaults:
      run:
        shell: powershell -ExecutionPolicy Bypass -command ". '{0}'"
    runs-on: [self-hosted, Windows, X64]
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify local Python and GPU tools
        run: |
          python --version
          $blenderExe = "C:\Program Files\Blender Foundation\Blender 5.3\blender.exe"
          if (-not (Test-Path $blenderExe)) {
            throw "Blender executable not found at: $blenderExe"
          }
          if (-not (Get-Command ffmpeg -ErrorAction SilentlyContinue)) {
            throw "FFmpeg is not in PATH. Install FFmpeg and add its bin folder to PATH."
          }
          & $blenderExe --version
          ffmpeg -version
          if (Get-Command nvidia-smi -ErrorAction SilentlyContinue) {
            nvidia-smi
          } else {
            Write-Warning "nvidia-smi not found; NVIDIA driver status could not be checked."
          }

      - name: Confirm repository files
        run: |
          if (-not (Test-Path requirements.txt)) {
            throw "requirements.txt is missing from the repository."
          }
          if (-not (Test-Path main.py)) {
            throw "main.py is missing from the repository."
          }
          Write-Host "Local runner, Python, Blender, FFmpeg, and repository checks completed."

      - name: Render a real test scene on the NVIDIA GPU
        run: |
          $blenderExe = "C:\Program Files\Blender Foundation\Blender 5.3\blender.exe"
          $testScript = Join-Path $env:RUNNER_TEMP "blender_gpu_test.py"
          $renderOutput = Join-Path $env:RUNNER_TEMP "blender-gpu-test.png"
          $pythonScript = @'
          import bpy
          import os
          from mathutils import Vector

          prefs = bpy.context.preferences.addons["cycles"].preferences
          prefs.compute_device_type = "OPTIX"
          prefs.get_devices()
          gpu_devices = [d for d in prefs.devices if d.type == "OPTIX"]
          if not gpu_devices:
              raise RuntimeError("No OptiX GPU device was found by Blender.")
          for device in prefs.devices:
              device.use = (device.type == "OPTIX")
          print("SELECTED_GPU_DEVICES:", [d.name for d in gpu_devices])

          bpy.ops.object.select_all(action="SELECT")
          bpy.ops.object.delete(use_global=False)

          bpy.ops.mesh.primitive_uv_sphere_add(segments=32, ring_count=16, location=(0, 0, 0))
          sphere = bpy.context.object
          sphere.name = "GPU_Test_Sphere"

          material = bpy.data.materials.new("GPU_Test_Material")
          material.diffuse_color = (0.12, 0.35, 0.8, 1.0)
          sphere.data.materials.append(material)

          bpy.ops.object.camera_add(location=(4, -6, 3.5))
          camera = bpy.context.object
          direction = Vector((0, 0, 0)) - camera.location
          camera.rotation_euler = direction.to_track_quat("-Z", "Y").to_euler()
          bpy.context.scene.camera = camera

          bpy.ops.object.light_add(type="AREA", location=(1, -3, 4))
          light = bpy.context.object
          light.data.energy = 500
          light.data.shape = "DISK"
          light.data.size = 4

          scene = bpy.context.scene
          scene.render.engine = "CYCLES"
          scene.cycles.device = "GPU"
          scene.cycles.samples = 8
          scene.render.resolution_x = 256
          scene.render.resolution_y = 256
          scene.render.resolution_percentage = 100
          scene.render.image_settings.file_format = "PNG"
          scene.render.filepath = os.path.join(os.environ["RUNNER_TEMP"], "blender-gpu-test.png")
          bpy.ops.render.render(write_still=True)
          print("GPU_TEST_RENDER_COMPLETE:", scene.render.filepath)
          '@
          [System.IO.File]::WriteAllText($testScript, $pythonScript, (New-Object System.Text.UTF8Encoding($false)))
          & $blenderExe -b -noaudio --python $testScript
          if ($LASTEXITCODE -ne 0) {
            throw "Blender GPU test render failed with exit code $LASTEXITCODE"
          }
          if (-not (Test-Path $renderOutput)) {
            throw "Blender did not create the expected GPU test image."
          }
          Write-Host "GPU test render image created: $renderOutput"
